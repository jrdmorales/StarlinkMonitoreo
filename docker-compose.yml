services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starlink
      POSTGRES_USER: starlink
      # El default starlink_dev es solo para desarrollo local — en producción,
      # setear POSTGRES_PASSWORD en el .env del host con un valor fuerte.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://starlink:${POSTGRES_PASSWORD}@postgres:5432/starlink
      NODE_ENV: production
      PORT: 3000
      # Fija el TZ del proceso a Chile — sin esto, Docker usa UTC por defecto y
      # los cálculos de ciclo de facturación (día 14 a día 13) se corren hasta 4h.
      TZ: America/Santiago
      NEWRELIC_API_KEY: ${NEWRELIC_API_KEY}
      NEWRELIC_ACCOUNT_ID: ${NEWRELIC_ACCOUNT_ID:-7041272}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-172.30.10.130}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-informatica@excon.cl}
      FETCH_CRON: ${FETCH_CRON:-0 */4 * * *}
      ALERT_THRESHOLDS: ${ALERT_THRESHOLDS:-60,80,100}
      STARLINK_ACCOUNTS: ${STARLINK_ACCOUNTS:-}
      STARLINK_ENCRYPTION_KEY: ${STARLINK_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "172.30.10.172:32770:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
