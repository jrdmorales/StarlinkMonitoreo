services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starlink
      POSTGRES_USER: starlink
      POSTGRES_PASSWORD: starlink_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
