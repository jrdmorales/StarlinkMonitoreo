services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starlink
      POSTGRES_USER: starlink
      POSTGRES_PASSWORD: starlink_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000"
    environment:
      DATABASE_URL: postgresql://starlink:starlink_dev@postgres:5432/starlink
      NODE_ENV: production
      PORT: 3000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
