services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starlink
      POSTGRES_USER: starlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starlink_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://starlink:starlink_dev@postgres:5432/starlink
      NODE_ENV: production
      PORT: 3000
      NEWRELIC_API_KEY: ${NEWRELIC_API_KEY}
      NEWRELIC_ACCOUNT_ID: ${NEWRELIC_ACCOUNT_ID:-7041272}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-172.30.10.130}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-n8n@excon.cl}
      FETCH_CRON: ${FETCH_CRON:-0 */4 * * *}
      ALERT_THRESHOLDS: ${ALERT_THRESHOLDS:-60,80,100}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "172.30.10.172:32769:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
